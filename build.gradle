plugins {

    id 'net.fabricmc.fabric-loom-remap' version '1.16-SNAPSHOT'
    // uses qouteall's fork of fabric loom, see settings.gradle

    id 'maven-publish'

    id "me.modmuss50.mod-publish-plugin" version "2.2.1"
    // https://modmuss50.github.io/mod-publish-plugin/
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    flatDir {
        dirs 'deps'
    }
}

version = rootProject.mod_version

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'JitPack'
        url = 'https://jitpack.io'
    }

    // cloth config
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }

    // for sodium
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }

    // for parchment
    maven {
        url = "https://maven.parchmentmc.org"
    }

    // for cardinal components that gravity changer uses
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
    // sable
    maven {
        name = "RyanHCode Maven"
        url = "https://maven.ryanhcode.dev/releases"
    }
    // veil
    maven {
        name = 'BlameJared Maven (CrT / Bookshelf)'
        url = 'https://maven.blamejared.com'
    }
    // Forge Config API Port For Sable
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }

    // geckolib, for testing with portal gun
    maven { url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }


}

loom {
    accessWidenerPath = file("src/main/resources/imm_ptl.accesswidener")
}

sourceSets {
    gametest {
        java.srcDir 'src/gametest/java'
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    mappings loom.layered() {
        officialMojangMappings() {
            setNameSyntheticMembers(false)
        }
        parchment("org.parchmentmc.data:parchment-1.21:2024.07.28")
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}") {
        exclude module: "fabric-gametest-api-v1"
        // Keep GameTest out of the normal dev runtime; it is added to the test mod below.
    }

    modApi("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    modCompileOnly "maven.modrinth:modmenu:${modmenu_version}"
    modLocalRuntime "maven.modrinth:modmenu:${modmenu_version}"

    modCompileOnly("com.github.Virtuoel:Pehkui:${pehkui_version}", {
        exclude group: "net.fabricmc.fabric-api"
        transitive(false)
    })

    modCompileOnly "${project.sodium_path}"

    modCompileOnly "${project.iris_path}"

    modCompileOnly("com.github.qouteall:GravityChanger:${gravity_changer_version}") {
        exclude(group: "net.fabricmc.fabric-api")
        transitive(false)
    }

    modApi("com.github.iPortalTeam:DimLib:${dimlib_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    include("com.github.iPortalTeam:DimLib:${dimlib_version}")


    modCompileOnly("dev.ryanhcode.sable:sable-common-${project.minecraft_version}:2.0.3") {
    exclude (group: "io.github.ocelot")
    exclude group: "foundry.veil"
    }

    modCompileOnly("foundry.veil:veil-fabric-${project.minecraft_version}:4.3.0") {
    exclude group: "maven.modrinth"
    exclude group: "io.github.ocelot"
    exclude group: "me.fallenbreath"
    exclude(group: "net.fabricmc.fabric-api")
    }

    modCompileOnly "maven.modrinth:distanthorizons:${distant_horizons_version}"

    // put these into inner mod to reduce duplicate MC jar

    if (project.enable_sodium.equals('true')) {
        modLocalRuntime "${project.sodium_path}"
    }

    if (project.enable_iris.equals('true')) {
        modLocalRuntime "${project.iris_path}"
        implementation "org.anarres:jcpp:1.4.14" // for iris
        implementation 'io.github.douira:glsl-transformer:2.0.0-pre13' // for iris
        implementation 'org.antlr:antlr4-runtime:4.11.1' // for iris
    }

    if (project.enable_pehkui.equals('true')) {
        modLocalRuntime("com.github.Virtuoel:Pehkui:${pehkui_version}", {
            exclude(group: "net.fabricmc.fabric-api")
        })
    }

    if (project.enable_gravity_changer.equals('true')) {
        modLocalRuntime("com.github.qouteall:GravityChanger:${gravity_changer_version}") {
            exclude(group: "net.fabricmc.fabric-api")
        }
    }

    if (project.enable_geckolib.equals('true')) {
        // for testing portal gun using dev jar
        modLocalRuntime('software.bernie.geckolib:geckolib-fabric-1.20:4.2') {
            transitive(false)
        }
    }

    if (project.enable_test_mod.equals('true')) {
        fileTree(dir: 'deps', include: '*.jar').each {
            String baseName = it.name.replace(".jar", "")
            String version = "0.1.0"
            int split = baseName.lastIndexOf('-')

            if (split != -1) {
                version = baseName.substring(split + 1)
                baseName = baseName.substring(0, split)
            }

            String name = "testmod:${baseName}:${version}"

            System.out.println("Found test mod: " + it.name.replace(".jar", "") + " -> " + name)

            modImplementation name
        }
    }
    testImplementation(platform('org.junit:junit-bom:5.10.0'))
    testImplementation('org.junit.jupiter:junit-jupiter')

    gametestImplementation sourceSets.main.output
    def fabricGametestApi = "net.fabricmc.fabric-api:fabric-gametest-api-v1:2.0.5+6fc22b9919"
    gametestCompileOnly fabricGametestApi
    // Add the mapped runtime dependency only for explicit GameTest runs.
    if (gradle.startParameter.taskNames.any {
        def taskName = it.substring(it.lastIndexOf(":") + 1)
        taskName.equalsIgnoreCase("runGametest") || taskName.equalsIgnoreCase("runClientGameTest")
    }) {
        modImplementation fabricGametestApi
    }
}

loom {
    mods.register("immersive_portals_gametest") {
        sourceSet sourceSets.gametest
    }

    runs {
        gametestServer {
            server()
            name "GameTest Server"
            source sourceSets.gametest
            runDir "run/gametest"
        }
        gametest {
            inherit gametestServer
            name "Game Tests"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/reports/gametest.xml"
            runDir "build/gametest"
        }
        clientGameTest {
            client()
            name "Client Game Tests"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.buildDir}/reports/client-gametest.xml"
            runDir "build/gametest-client"
        }
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}


// change the output file name
remapJar {
    afterEvaluate {
        archiveFileName = "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}-fabric.jar"
    }
}


jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}"}
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}

// miscellaneous

task printClasspath {
    doLast {
        // NOTE don't forget to exclude the submod dev jar
        configurations.compileClasspath.each { println "\"" + (it.toString().replace("\\", "/")) + "\"," }
    }
}

// Enable ZGC: -XX:+UseZGC

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

publishMods {
    file = remapJar.archiveFile
    changelog = file("changelog.md").text
    type = STABLE
    modLoaders.add("fabric")

    displayName = "v${project.mod_version}-mc${project.minecraft_version}"
    version = "v${project.mod_version}-mc${project.minecraft_version}"

    curseforge {
        projectId = "1629226"
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
        requires("fabric-api")
    }
    modrinth {
        projectId = "l1aT5XRx"
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        minecraftVersions.add(minecraft_version)
        environment = CLIENT_AND_SERVER
        requires("fabric-api")
    }
    github {
        repository = "DigitalWolf1313/ImmersivePortalsMod-Updated"
        accessToken = providers.environmentVariable("GITHUB_TOKEN")
        commitish = "${project.git_branch}"
    }
}